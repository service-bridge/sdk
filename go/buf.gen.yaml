version: v2
# Go SDK stubs from ../proto (the contract's source of truth). Run through
# ../scripts/gen-proto.sh. The .proto files carry no go_package: each Go
# consumer maps them with M options. Plugins are pinned and run via `go run`;
# the runtime pins the same protoc-gen-go / protoc-gen-go-grpc versions.
inputs:
  - directory: ../proto
plugins:
  - local: ["go", "run", "google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11"]
    out: internal/pb
    opt:
      - paths=source_relative
      - Mservicebridge/v1/bootstrap.proto=github.com/service-bridge/sdk/go/internal/pb/servicebridge/v1;pb
      - Mservicebridge/v1/call.proto=github.com/service-bridge/sdk/go/internal/pb/servicebridge/v1;pb
      - Mservicebridge/v1/control.proto=github.com/service-bridge/sdk/go/internal/pb/servicebridge/v1;pb
      - Mservicebridge/v1/events.proto=github.com/service-bridge/sdk/go/internal/pb/servicebridge/v1;pb
      - Mservicebridge/v1/invoke.proto=github.com/service-bridge/sdk/go/internal/pb/servicebridge/v1;pb
      - Mservicebridge/v1/jobs.proto=github.com/service-bridge/sdk/go/internal/pb/servicebridge/v1;pb
      - Mservicebridge/v1/registry.proto=github.com/service-bridge/sdk/go/internal/pb/servicebridge/v1;pb
      - Mservicebridge/v1/telemetry.proto=github.com/service-bridge/sdk/go/internal/pb/servicebridge/v1;pb
      - Mservicebridge/v1/ui.proto=github.com/service-bridge/sdk/go/internal/pb/servicebridge/v1;pb
      - Mservicebridge/v1/workflows.proto=github.com/service-bridge/sdk/go/internal/pb/servicebridge/v1;pb
  - local: ["go", "run", "google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2"]
    out: internal/pb
    opt:
      - paths=source_relative
      - require_unimplemented_servers=false
      - Mservicebridge/v1/bootstrap.proto=github.com/service-bridge/sdk/go/internal/pb/servicebridge/v1;pb
      - Mservicebridge/v1/call.proto=github.com/service-bridge/sdk/go/internal/pb/servicebridge/v1;pb
      - Mservicebridge/v1/control.proto=github.com/service-bridge/sdk/go/internal/pb/servicebridge/v1;pb
      - Mservicebridge/v1/events.proto=github.com/service-bridge/sdk/go/internal/pb/servicebridge/v1;pb
      - Mservicebridge/v1/invoke.proto=github.com/service-bridge/sdk/go/internal/pb/servicebridge/v1;pb
      - Mservicebridge/v1/jobs.proto=github.com/service-bridge/sdk/go/internal/pb/servicebridge/v1;pb
      - Mservicebridge/v1/registry.proto=github.com/service-bridge/sdk/go/internal/pb/servicebridge/v1;pb
      - Mservicebridge/v1/telemetry.proto=github.com/service-bridge/sdk/go/internal/pb/servicebridge/v1;pb
      - Mservicebridge/v1/ui.proto=github.com/service-bridge/sdk/go/internal/pb/servicebridge/v1;pb
      - Mservicebridge/v1/workflows.proto=github.com/service-bridge/sdk/go/internal/pb/servicebridge/v1;pb
