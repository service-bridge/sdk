version: v2
modules:
  - path: .
    name: buf.build/service-bridge/sdk
lint:
  use:
    - STANDARD
  except:
    - SERVICE_SUFFIX
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
  # Channel and Status are mirrored 1:1 by the telemetry columns and by the
  # console; their unprefixed value names are part of the wire contract.
  ignore_only:
    ENUM_VALUE_PREFIX:
      - servicebridge/v1/telemetry.proto
breaking:
  use:
    - FILE
