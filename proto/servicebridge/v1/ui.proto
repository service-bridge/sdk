syntax = "proto3";

package servicebridge.v1;

// UI exposes the runtime's global topology view for the dashboard. NOT
// reachable through the regular SDK API on purpose — only a dedicated UI
// consumer (separate mTLS identity / SPIFFE role 'ui-dashboard' once roles
// land) calls into this service.
service UI {
  // GetServiceGraph returns the full service topology in one shot: every
  // active service with its handlers, instances, outgoing declarations,
  // event subscriptions and policy rules. UI computes edges client-side from
  // these nodes (rpc.call <-> rpc.handle by name; event.publish <->
  // event.handle by topic-pattern).
  rpc GetServiceGraph(GetServiceGraphRequest) returns (ServiceGraph);
}

message GetServiceGraphRequest {
  // Reserved for future filters (per-status, since-time, etc.). Empty for v1.
}

message ServiceGraph {
  repeated ServiceNode services = 1;
}

message ServiceNode {
  string service_id     = 1;
  string service_name   = 2;
  string service_status = 3;  // 'active' | 'revoked'

  // Capability flags (TRUE means service may register that handler type).
  bool cap_rpc_handle      = 4;
  bool cap_event_handle    = 5;
  bool cap_workflow_handle = 6;
  bool cap_job_handle      = 7;

  // Registered handlers.
  repeated UIMethod  methods            = 8;
  // Live instances.
  repeated UIInstance instances         = 9;
  // Outgoing calls declared by this service (sb.service deps).
  repeated UIOutgoing outgoing_calls    = 10;
  // Durable event subscriptions of this service (may include wildcards).
  repeated UIEventSubscription event_subscriptions = 11;
  // Policy rules attached to this service. Direction is 'E' or 'A'.
  repeated UIPolicyRule policy_rules    = 12;
}

message UIMethod {
  string name           = 1;
  string type           = 2;   // 'rpc' | 'event' | 'workflow' | 'job' | 'http'
  string contract_hash  = 3;
  bool   streaming      = 4;
  bool   published      = 5;   // true for events declared as publisher
}

message UIInstance {
  string instance_id   = 1;
  string status        = 2;
  string call_endpoint = 3;
  string http_endpoint = 4;
}

message UIOutgoing {
  string target_service_id = 1;
  string target_method     = 2;
  string target_type       = 3;   // 'rpc' | 'workflow' | 'http'
}

message UIEventSubscription {
  string pattern = 1;
  bool   durable = 2;
}

message UIPolicyRule {
  string direction                = 1;   // 'E' | 'A'
  string action                   = 2;   // rpc.call | rpc.handle | event.publish | ...
  string analytics_peer_service_id = 3;  // empty for event.* (no per-service routing)
  string target_name              = 4;
}
