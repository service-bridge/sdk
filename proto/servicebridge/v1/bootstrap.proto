syntax = "proto3";

package servicebridge.v1;

service Bootstrap {
  rpc Provision(ProvisionRequest) returns (ProvisionResponse);
}

// BootstrapKeyPayload is the wire-format struct for the bootstrap key.
// Serialised with proto.Marshal and base64url-encoded with an "sb." prefix.
message BootstrapKeyPayload {
  bytes key_id      = 1;
  bytes secret      = 2;
  bytes ca_cert_der = 3;
}

message ProvisionRequest {
  bytes key_id = 1;   // 8 bytes
  bytes secret = 2;   // 32 bytes
  bytes csr_der = 3;  // PKCS#10, client holds privkey in memory
}

message ProvisionResponse {
  bytes  cert_der      = 1;
  bytes  ca_chain_der  = 2;
  string service_id    = 3;  // stable UUID, in SAN cert
  string service_name  = 4;  // human label, mutable, NOT in cert
  string instance_id   = 5;  // UUID of this instance, in SAN cert
  int64  not_after_unix_ms = 6; // cert expiry (unix-ms) for scheduling refresh
}
