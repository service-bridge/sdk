name: CI

on:
  # Branches only: a release tag points at a commit this workflow already ran
  # on, and an unfiltered push trigger runs the whole suite again per tag.
  push:
    branches: [main]
  pull_request:
  # Lets the e2e job be re-run on its own without pushing a commit.
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  proto:
    name: proto contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: bufbuild/buf-action@v1
        with:
          version: 1.69.0
          setup_only: true
      - run: bun install --frozen-lockfile
        working-directory: node
      # gen-proto.sh runs `buf lint` first, then regenerates the Go and Node
      # stubs with pinned plugins; committed stubs must match byte for byte.
      - run: bash scripts/gen-proto.sh
      - name: stubs match proto/
        run: |
          git status --porcelain -- go/internal/pb node/src/pb
          test -z "$(git status --porcelain -- go/internal/pb node/src/pb)"

  node:
    name: node SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./node
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test src/
      # Non-e2e regression suites (no runtime needed): build-output invariant
      # (single AsyncLocalStorage across entry bundles) + HTTP→downstream trace
      # nesting. e2e/ and showcase/ are excluded — they need a live runtime.
      - run: bun test tests/build tests/http
      - run: bun run build

  go:
    name: go SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
      - run: go test -race ./...
      # sbgin is its own module so gin stays out of every consumer's graph; it
      # is not covered by the commands above.
      - name: sbgin module
        working-directory: ./go/sbgin
        run: go vet ./... && go test ./...

  # The SDK↔runtime e2e suite does not live here. It needs the runtime, and the
  # runtime is distributed as a container image, not as source: this repository
  # is public and must never be able to read the runtime's source tree. The
  # suite therefore runs in the runtime repository, which checks this one out.

  packed:
    name: packed artifact (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        runtime: [node22, node24, node26, bun]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.runtime == 'node22' && '22' || matrix.runtime == 'node26' && '26' || '24' }}
      - run: bun install --frozen-lockfile
        working-directory: node
      - run: npm pack --pack-destination "$RUNNER_TEMP"
        working-directory: node
      - name: install and exercise the published exports
        env:
          SMOKE_RUNTIME: ${{ matrix.runtime }}
        run: |
          mkdir "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init -y
          if [ "$SMOKE_RUNTIME" = bun ]; then
            bun add "$RUNNER_TEMP"/service-bridge-*.tgz express fastify hono
          else
            npm install "$RUNNER_TEMP"/service-bridge-*.tgz express fastify hono
          fi
          if tar tzf "$RUNNER_TEMP"/service-bridge-*.tgz | grep -q '\.map$'; then echo "source maps must not be published"; exit 1; fi
          cp "$GITHUB_WORKSPACE/node/tests/fixtures/packed-smoke.mjs" smoke.mjs
          if [ "$SMOKE_RUNTIME" = bun ]; then bun smoke.mjs; else node smoke.mjs; fi
