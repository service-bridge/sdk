name: CI

on:
  # Branches only: a release tag points at a commit this workflow already ran
  # on, and an unfiltered push trigger runs the whole suite again per tag.
  push:
    branches: [main]
  pull_request:
  # Lets the e2e job be re-run on its own without pushing a commit.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    name: node SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./node
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test src/
      # Non-e2e regression suites (no runtime needed): build-output invariant
      # (single AsyncLocalStorage across entry bundles) + HTTP→downstream trace
      # nesting. e2e/ and showcase/ are excluded — they need a live runtime.
      - run: bun test tests/build tests/http
      - run: bun run build

  go:
    name: go SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
      - run: go test -race ./...
      # sbgin is its own module so gin stays out of every consumer's graph; it
      # is not covered by the commands above.
      - name: sbgin module
        working-directory: ./go/sbgin
        run: go vet ./... && go test ./...

  # The SDK↔runtime e2e suite does not live here. It needs the runtime, and the
  # runtime is distributed as a container image, not as source: this repository
  # is public and must never be able to read the runtime's source tree. The
  # suite therefore runs in the runtime repository, which checks this one out.
