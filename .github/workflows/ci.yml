name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: node SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./node
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test src/
      # Non-e2e regression suites (no runtime needed): build-output invariant
      # (single AsyncLocalStorage across entry bundles) + HTTP→downstream trace
      # nesting. e2e/ and showcase/ are excluded — they require a live runtime.
      - run: bun test tests/build tests/http
      - run: bun run build
